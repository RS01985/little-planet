<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="小小地球"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#07121b"><title>小小地球 · Little Planet</title><link rel="stylesheet" href="styles.css"></head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="app">
<header><a class="brand" href="#" aria-label="小小地球首頁"><span class="brand-planet" aria-hidden="true"></span><span data-t="brand">小小地球</span><small>LITTLE PLANET</small></a><div class="header-actions"><button id="language" class="quiet" aria-label="Switch to English">EN</button><button id="parents" class="quiet" data-t="grownups">給大人的小筆記</button></div></header>
<main>
<nav class="modes" aria-label="選擇旅程"><button id="earthMode" class="active" aria-pressed="true"><span aria-hidden="true">◉</span> <span data-t="earthStory">地球的故事</span></button><button id="humanMode" aria-pressed="false"><span aria-hidden="true">⁙</span> <span data-t="humanStory">人類的旅程</span></button></nav>
<section class="stage" aria-label="互動地球">
<div class="story"><div class="era"><span class="live-dot"></span><span id="eraDate"></span></div><h1 id="title"></h1><p id="description"></p><div class="story-actions"><button id="listen" class="listen"><span aria-hidden="true">♫</span> <span data-t="listen">聽故事</span></button><span id="chapter"></span></div><div class="wonder"><span class="wonder-symbol" aria-hidden="true">✧</span><div><span class="mini" data-t="wonder">一起想一想</span><p id="question"></p></div></div><button id="start" class="primary"><span data-t="start">回到故事的開始</span><span aria-hidden="true">↗</span></button><button id="mapExplore" class="explore">認識大洲與海洋 ↗</button></div>
<div class="world"><span id="zoomLevel" class="zoom-level" hidden></span><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="globe-wrap" id="globeWrap"><canvas id="globe" tabindex="0" role="img" aria-label="可以拖曳旋轉的地球；也可用方向鍵轉動"></canvas><canvas id="routes" aria-hidden="true"></canvas><div id="fallback" hidden><div class="fallback-sphere"></div><p data-t="fallback">此裝置未能顯示 3D；仍可探索全部故事。</p></div><button id="place" class="place" hidden></button></div><div class="world-caption"><span class="tiny-star">✦</span><span id="worldCaption"></span></div><div class="globe-toolbar"><span class="drag-hint" data-t="drag">用手指轉轉地球</span><div class="tool-divider"></div><button id="rotate" title="暫停地球旋轉" aria-label="暫停地球旋轉" aria-pressed="true">Ⅱ</button><button id="zoomIn" aria-label="放大地球">＋</button><button id="zoomOut" aria-label="縮小地球">−</button><button id="reset" aria-label="重設地球視角">↺</button></div></div>
</section>
<section class="timeline-panel" aria-label="故事時間軸"><div class="timeline-heading"><div><span class="tiny-star">✦</span> <span id="timelineTitle">每一站，都是新發現</span></div><button id="play" class="play"><span aria-hidden="true">▶</span><span data-t="play">自動旅行</span></button></div><div id="timeline" class="timeline"></div><div class="scrubber-row"><span id="oldest"></span><input id="scrubber" type="range" min="0" max="6" step="1" value="6" aria-label="選擇故事時間"><span data-t="now">今天</span></div><div class="timeline-bottom"><span id="timelineNote" data-t="notToScale">故事站之間的距離，不代表實際時間長短</span><div class="stepper"><button id="prev" aria-label="上一站">←</button><span id="stepCount"></span><button id="next" aria-label="下一站">→</button></div></div></section>
</main><footer><span data-t="footer">給小小探險家，和陪他們看世界的大人。</span><button id="sources" data-t="sources">科學資料與影像來源 ↗</button></footer>
</div>
<dialog id="mapDialog"><button id="closeMap" class="close" aria-label="關閉">×</button><div id="mapBody"></div></dialog><dialog id="notes"><button id="closeNotes" class="close" aria-label="關閉">×</button><div id="notesBody"></div></dialog><div id="toast" role="status"></div>
<script src="app.js"></script></body></html>
